name: Test Zenduty Integration Key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          zenduty_integration_key: 'fake-zenduty-integration-key-for-testing'
          zenduty_service_id: 'fake-zenduty-service-id-for-testing'
          zenduty_escalation_policy_id: 'fake-zenduty-escalation-policy-id-for-testing'
          count: '1'
        continue-on-error: true
      - name: Assert action ran (Zenduty call may fail with invalid key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with zenduty_integration_key, zenduty_service_id, zenduty_escalation_policy_id inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
