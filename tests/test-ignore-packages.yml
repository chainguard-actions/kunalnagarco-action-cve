name: Test ignore packages input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with ignore list
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          ignore: 'lodash,axios,moment'
          count: '20'
        continue-on-error: true
      - name: Assert action ran with ignore list
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run without a code-level crash.
          # API may return 403/404 if Dependabot is not enabled, which is acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ignore list and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
