name: Test Zenduty API key (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          zenduty_api_key: fake-zenduty-api-key-12345
          zenduty_service_id: fake-zenduty-service-id-12345
          zenduty_escalation_policy_id: fake-zenduty-escalation-policy-id-12345
          count: '1'
      - name: Assert action ran (zenduty_api_key inputs accepted, may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with zenduty_api_key, zenduty_service_id, zenduty_escalation_policy_id inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
