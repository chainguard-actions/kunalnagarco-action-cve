name: Test Zenduty API key inputs (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          zenduty_api_key: fake-zenduty-api-key-1234567890abcdef
          zenduty_service_id: fake-zenduty-service-id-abcdef123456
          zenduty_escalation_policy_id: fake-zenduty-escalation-policy-id-abcdef
          count: '5'
      - name: Assert action ran (zenduty API key inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with zenduty API key inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
