name: Test PagerDuty Integration Key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          pager_duty_integration_key: 'fake-pagerduty-integration-key-for-testing'
          count: '1'
        continue-on-error: true
      - name: Assert action ran (PagerDuty call may fail with invalid key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with pager_duty_integration_key input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
