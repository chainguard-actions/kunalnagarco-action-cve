name: Test basic usage - token only, no notifications
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with token only (no notification targets)
        id: action
        uses: .
        with:
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action either succeeds (0 alerts or alerts with no notification targets)
          # or fails gracefully if Dependabot is not enabled on this repo.
          # Both 'success' and 'failure' are acceptable outcomes for this test —
          # what we verify is that the action ran and produced a deterministic outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
