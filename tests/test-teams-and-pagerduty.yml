name: Test Microsoft Teams and PagerDuty inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          microsoft_teams_webhook: https://outlook.office.com/webhook/fake-teams-webhook
          pager_duty_integration_key: fake-pagerduty-key-for-coverage
          count: 1
      - name: Assert action ran (input coverage check)
        run: |
          echo "Action completed (with or without error - input coverage is what matters)"
          echo "PASS: microsoft_teams_webhook and pager_duty_integration_key inputs were passed"
