name: Test ecosystem filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with ecosystem filter (npm)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          count: '10'
          ecosystem: 'npm'
      - name: Assert action ran and produced a valid outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action either:
          # - Succeeds (if Dependabot is enabled and alerts are fetched, or no alerts)
          # - Fails (if Dependabot is not enabled on this repo, API returns 403/404)
          # Both are valid outcomes — we just verify the action ran to completion.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ecosystem=npm filter and produced a valid outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
