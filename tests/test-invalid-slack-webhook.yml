name: Test invalid Slack webhook URL validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid Slack webhook URL
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          slack_webhook: 'https://invalid-not-a-slack-webhook.example.com/hook'
          count: 20
          severity: critical,high
        continue-on-error: true

      - name: Assert action completed (success or failure depending on alerts and Dependabot state)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action either:
          # - succeeds if there are no open alerts (nothing to send, invalid webhook never used)
          # - fails if there are alerts AND the invalid webhook URL is rejected
          # - fails if Dependabot is not enabled on this repo
          # In all cases, the action should produce a deterministic outcome (not hang or crash).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
