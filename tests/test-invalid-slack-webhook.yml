name: Test invalid Slack webhook URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid Slack webhook URL
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          slack_webhook: 'https://invalid-not-a-slack-webhook.example.com/hook'
          count: '5'
        continue-on-error: true
      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action either:
          # - succeeds (no alerts found, so Slack validation is never reached)
          # - fails with "Invalid Slack Webhook URL" (alerts found, invalid URL detected)
          # - fails with API error (Dependabot not enabled on repo)
          # All of these are valid outcomes — the action should not crash with an unhandled error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
