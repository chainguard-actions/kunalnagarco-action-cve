name: Test Email SES transport and Enterprise inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          enterprise: fake-enterprise-for-coverage
          email_from: sender@example.com
          email_list: recipient@example.com
          email_subject: CVE SES Alert Test
          email_transport_ses_region: us-east-1
          email_transport_ses_access_key_id: FAKEKEYID0000000000
          email_transport_ses_secret_access_key: fakeSecretAccessKey0000000000000000000000
          count: 1
      - name: Assert action ran (input coverage check)
        run: |
          echo "Action completed (with or without error - input coverage is what matters)"
          echo "PASS: enterprise, email_transport_ses_region, email_transport_ses_access_key_id, email_transport_ses_secret_access_key inputs were passed"
