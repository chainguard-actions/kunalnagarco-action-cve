name: Test Email SES Configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          email_from: 'sender@example.com'
          email_list: 'recipient@example.com'
          email_subject: 'CVE Alert Test - SES'
          email_transport_ses_region: 'us-east-1'
          email_transport_ses_access_key_id: 'AKIAFAKEACCESSKEYID'
          email_transport_ses_secret_access_key: 'fake-ses-secret-access-key-for-testing'
          count: '1'
        continue-on-error: true
      - name: Assert action ran (SES call may fail with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with email_transport_ses_region, email_transport_ses_access_key_id, email_transport_ses_secret_access_key inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
