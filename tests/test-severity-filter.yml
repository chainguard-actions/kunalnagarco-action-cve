name: Test severity filter input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with severity filter (critical only)
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          severity: critical
          count: 5
        continue-on-error: true

      - name: Assert action completed with severity filter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed (fetched alerts filtered by severity)
          # or fail gracefully (e.g. Dependabot not enabled on this repo).
          # We verify the action ran and produced a deterministic outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' using severity=critical"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
