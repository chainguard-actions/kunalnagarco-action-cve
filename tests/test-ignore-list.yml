name: Test ignore list and ecosystem inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/Hello-World
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          ignore: 'lodash,axios'
          ecosystem: 'npm'
          count: '20'

      - name: Assert action ran with ignore list and failed with expected auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token, the GitHub API call will fail with an auth error
          # The action catches this and calls setFailed, so outcome should be 'failure'
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' due to invalid token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token when using ignore list and ecosystem filter"
