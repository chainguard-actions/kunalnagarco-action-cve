name: Test org-level alerts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          org: 'my-test-org'
          severity: 'critical'
          count: '5'

      - name: Assert action ran with org input and failed with expected auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token, the GitHub API call to org alerts endpoint will fail
          # The action catches this and calls setFailed, so outcome should be 'failure'
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' due to invalid token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token when fetching org alerts"
