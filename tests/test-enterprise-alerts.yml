name: Test enterprise input for enterprise-level alerts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with enterprise input
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          enterprise: 'example-enterprise-that-does-not-exist'
          count: '5'
      - name: Assert action ran and produced a valid outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action either succeeds (enterprise found, alerts fetched) or fails (enterprise not found / no access).
          # Both are valid — we just verify the action ran to completion.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
