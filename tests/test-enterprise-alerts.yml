name: Test Enterprise Alerts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          enterprise: 'fake-enterprise-name-for-testing'
          count: '1'
        continue-on-error: true
      - name: Assert action ran (enterprise alerts may fail without enterprise access)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with enterprise input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
