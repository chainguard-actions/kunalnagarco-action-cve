name: Test pager_duty_integration_key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with PagerDuty integration key input
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          count: '5'
          pager_duty_integration_key: 'fake-pagerduty-integration-key-for-testing'
      - name: Assert action ran and produced a valid outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action either succeeds (no alerts) or fails (API/PagerDuty error).
          # Both are valid — we just verify the action ran to completion.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
