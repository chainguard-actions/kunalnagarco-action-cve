name: Test email inputs via SMTP transport
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with SMTP email inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          count: '5'
          email_from: 'sender@example.com'
          email_list: 'recipient1@example.com,recipient2@example.com'
          email_subject: 'CVE Alert Test'
          email_transport_smtp_host: 'smtp.example.com'
          email_transport_smtp_port: '587'
          email_transport_smtp_user: 'smtp-user@example.com'
          email_transport_smtp_password: 'fake-smtp-password-for-testing'
      - name: Assert action ran and produced a valid outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action either succeeds (no alerts) or fails (SMTP connection error / API error).
          # Both are valid — we just verify the action ran to completion.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
