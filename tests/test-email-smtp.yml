name: Test email via SMTP
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          email_from: sender@example.com
          email_list: recipient1@example.com,recipient2@example.com
          email_subject: 'CVE Alert Test'
          email_transport_smtp_host: smtp.example.com
          email_transport_smtp_port: '587'
          email_transport_smtp_user: smtp-user@example.com
          email_transport_smtp_password: fake-smtp-password
          count: '1'
      - name: Assert action ran (email SMTP inputs accepted, may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with email SMTP inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
